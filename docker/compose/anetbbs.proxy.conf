map $http_upgrade $anetbbs_connection_upgrade {
    default upgrade;
    ''      close;
}

# Public ingress terminates TLS before reaching this listener.
# Preserve the HTTPS value only from the configured reverse proxy.
map $http_x_forwarded_proto $anetbbs_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 5000;
    server_name _;
    client_max_body_size 110m;

    # Resolve service names per request so worker/container replacements
    # do not require restarting this nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $anetbbs_web http://web:5000;
    set $anetbbs_mrc http://mrc-bridge:8080;

    location / {
        proxy_pass $anetbbs_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anetbbs_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $anetbbs_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /mrc-auth-check {
        internal;
        proxy_pass $anetbbs_web/mrc/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $anetbbs_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    location = /mrcws {
        auth_request /mrc-auth-check;
        proxy_pass $anetbbs_mrc/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anetbbs_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
    }
}
