server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /srv/personal-pages;
    autoindex off;
    disable_symlinks on;
    types {
        text/html html htm;
        text/css css;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css;

    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-cache always;

    if ($request_method !~ "^(GET|HEAD)$") { return 405; }

    location ~ ^/users/[1-9][0-9]*/$ {
        rewrite ^/users/([1-9][0-9]*)/$ /users/$1/index.html last;
    }

    location ~* "^/users/[1-9][0-9]*/[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.(?:html?|css)$" {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
