{% extends "base.html" %}

{% block title %}{{ t('ui.heading.new_ansi_art', 'New ANSI Art') }}{% endblock %}

{% block content %}
<div class="bbs-header">
    <h1><i class="bi bi-plus-square"></i> {{ t('ui.heading.new_ansi_art', 'New ANSI Art') }}</h1>
</div>

<form method="post" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card-body">
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label">{{ t('ui.name', 'Name') }}</label>
                <input type="text" name="name" class="form-control" required
                       placeholder="Welcome screen">
            </div>
            <div class="col-md-3">
                <label class="form-label">Width</label>
                <input type="number" name="width" class="form-control" value="80" min="20" max="132">
            </div>
            <div class="col-md-3">
                <label class="form-label">Height</label>
                <input type="number" name="height" class="form-control" value="25" min="5" max="50">
            </div>
        </div>
        <button class="btn btn-primary"><i class="bi bi-easel"></i> Open Editor</button>
        <a href="{{ url_for('ansi_editor.index') }}" class="btn btn-link">{{ t('ui.cancel', 'Cancel') }}</a>
    </div>
</form>
{% endblock %}
